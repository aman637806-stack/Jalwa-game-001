<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jalwa.Game — WinGo Color Prediction</title>
  <style>
    :root {
      --bg: #070a14;
      --card: #12182b;
      --card-2: #1a233d;
      --text: #f5f7ff;
      --muted: #9aa7c7;
      --green: #16a34a;
      --green-bright: #19c37d;
      --red: #e11d48;
      --violet: #7c3aed;
      --gold: #f59e0b;
      --accent: #3b82f6;
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 56px; }
    .container { max-width: 480px; margin: 0 auto; padding: 10px 12px; }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      background: #0b1021; padding: 10px 12px; border-radius: 14px;
      border: 1px solid var(--border); position: sticky; top: 6px; z-index: 25;
    }
    .top-left { display: flex; align-items: center; gap: 8px; }
    .back-arrow { color: #cbd5e1; font-size: 18px; cursor: pointer; padding: 0 2px; }
    .brand { font-weight: 800; font-size: 20px; letter-spacing: 0.2px; cursor: pointer; user-select: none; }
    .brand span { color: var(--green-bright); font-weight: 700; font-size: 17px; }
    .uid-pill {
      background: #1b2442; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 700;
    }
    .lang-pill {
      background: #18223d; color: #e2e8f0; border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .top-right { display: flex; align-items: center; gap: 6px; }

    .reg-card {
      background: linear-gradient(180deg, #111930, #0d1324);
      border: 1px solid var(--border); border-radius: 18px;
      padding: 18px 16px; margin-top: 10px;
    }
    .auth-mode-switch {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      background: #0a0f1e; padding: 5px; border-radius: 999px;
      border: 1px solid var(--border); margin-bottom: 14px;
    }
    .auth-mode-btn {
      border: none; border-radius: 999px; padding: 9px 12px;
      font-size: 14px; font-weight: 800; background: transparent; color: var(--muted);
    }
    .auth-mode-btn.active {
      background: linear-gradient(90deg, #16b87e, #19c99b); color: #ffffff;
    }
    .reg-hero { text-align: center; margin-bottom: 14px; }
    .reg-phone-icon { font-size: 28px; color: #19c37d; line-height: 1; }
    .reg-heading {
      display: inline-block; font-size: 18px; font-weight: 800; color: #ffffff;
      margin-top: 8px; padding-bottom: 6px; border-bottom: 3px solid #19c37d;
    }
    .field-label {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 700; color: #e2e8f0; margin-top: 12px; margin-bottom: 6px;
    }
    .phone-row { display: grid; grid-template-columns: 88px 1fr; gap: 8px; }
    .dark-input {
      width: 100%; background: #17203a; color: #f8fafc;
      border: 1px solid rgba(255,255,255,0.09); border-radius: 10px;
      padding: 12px 12px; font-size: 14px; outline: none;
    }
    .dark-input::placeholder { color: #64748b; }
    .dark-input:focus { border-color: #19c37d; }
    .pw-wrap { position: relative; }
    .pw-wrap .dark-input { padding-right: 40px; }
    .eye-btn {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: transparent; border: none; color: #94a3b8; font-size: 15px; padding: 4px;
    }
    .agree-row {
      display: flex; align-items: center; gap: 8px; margin-top: 14px;
      font-size: 12px; color: #cbd5e1; cursor: pointer;
    }
    .agree-row input[type="checkbox"] {
      width: 16px; height: 16px; accent-color: #19c37d; cursor: pointer;
    }
    .privacy-link { color: #f87171; font-weight: 700; text-decoration: none; }
    .btn-register {
      width: 100%; margin-top: 16px; border: none; border-radius: 999px;
      padding: 12px 16px; font-size: 16px; font-weight: 800; color: #ffffff;
      background: linear-gradient(90deg, #16b87e, #19c99b);
      box-shadow: 0 6px 18px rgba(25, 195, 125, 0.28); cursor: pointer;
    }
    .switch-auth-note {
      text-align: center; margin-top: 12px; font-size: 12px; color: var(--muted);
    }
    .switch-auth-link {
      color: #34d399; font-weight: 700; cursor: pointer; text-decoration: underline;
    }

    .wallet-card {
      background: linear-gradient(145deg, #161f3a, #10172c);
      border: 1px solid var(--border); border-radius: 16px;
      padding: 16px 14px; margin-top: 10px; text-align: center;
    }
    .wallet-bal { font-size: 26px; font-weight: 800; color: #ffffff; letter-spacing: 0.3px; }
    .refresh-spin { cursor: pointer; color: #94a3b8; font-size: 15px; margin-left: 6px; }
    .wallet-sub { font-size: 12px; color: #cbd5e1; margin-top: 4px; }
    .wallet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
    .btn-withdraw {
      background: #ef4444; color: #fff; border: none; border-radius: 999px;
      padding: 11px 14px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .btn-deposit {
      background: #16a34a; color: #fff; border: none; border-radius: 999px;
      padding: 11px 14px; font-size: 15px; font-weight: 700; cursor: pointer;
    }

    .notice-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: #141c33; border: 1px solid var(--border); border-radius: 12px;
      padding: 8px 10px; margin-top: 10px; font-size: 12px; color: #e2e8f0;
    }
    .notice-text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .detail-pill {
      background: #17c985; color: #072217; border: none; border-radius: 999px;
      padding: 5px 12px; font-size: 12px; font-weight: 800; cursor: pointer; flex-shrink: 0;
    }

    .mode-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
    .mode-card {
      background: #131b31; border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 6px; text-align: center; cursor: pointer; color: var(--muted);
      font-size: 12px; font-weight: 700; line-height: 1.25;
    }
    .mode-card.active {
      background: linear-gradient(180deg, #1fd18b, #129c68);
      color: #ffffff; border-color: transparent;
    }
    .mode-icon { font-size: 20px; display: block; margin-bottom: 4px; }

    .timer-banner {
      display: grid; grid-template-columns: 1.15fr 1fr; gap: 8px;
      background: linear-gradient(135deg, #18c984, #10a86d);
      border-radius: 14px; padding: 12px; margin-top: 10px; color: #ffffff;
      position: relative;
    }
    .timer-banner::after {
      content: ""; position: absolute; top: 12px; bottom: 12px; left: 57%;
      border-left: 1.5px dashed rgba(255,255,255,0.65);
    }
    .howto-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: transparent; color: #ffffff; border: 1px solid rgba(255,255,255,0.8);
      border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .mode-title { font-size: 13px; font-weight: 700; margin-top: 8px; }
    .mini-balls { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
    .mini-ball {
      width: 22px; height: 22px; border-radius: 50%; display: inline-flex;
      align-items: center; justify-content: center; font-size: 11px; font-weight: 800;
      color: #fff; border: 1px solid rgba(255,255,255,0.45);
    }
    .timer-right { text-align: right; padding-left: 8px; }
    .time-rem-label { font-size: 12px; font-weight: 700; opacity: 0.95; }
    .digit-boxes { display: flex; justify-content: flex-end; gap: 4px; margin-top: 6px; }
    .digit-box {
      background: #ffffff; color: #10a86d; font-weight: 900; font-size: 18px;
      width: 24px; height: 30px; border-radius: 5px; display: inline-flex;
      align-items: center; justify-content: center;
    }
    .digit-colon { font-weight: 900; font-size: 18px; display: inline-flex; align-items: center; }
    .period-code { font-size: 12px; font-weight: 700; margin-top: 7px; letter-spacing: 0.3px; }

    .bet-board {
      background: #12182b; border: 1px solid var(--border); border-radius: 16px;
      padding: 12px; margin-top: 10px;
    }
    .color-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .c-btn {
      border: none; border-radius: 10px; padding: 11px 6px; font-size: 15px;
      font-weight: 700; color: #ffffff; cursor: pointer;
    }
    .c-green { background: #16a34a; }
    .c-violet { background: #8b5cf6; }
    .c-red { background: #ef4444; }

    .balls-panel {
      background: #0d1222; border-radius: 14px; padding: 12px 10px; margin-top: 12px;
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px 8px; justify-items: center;
    }
    .ball-btn {
      width: 46px; height: 46px; border-radius: 50%; border: none;
      color: #ffffff; font-size: 18px; font-weight: 800; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.45);
    }
    .ball-green { background: radial-gradient(circle at 30% 30%, #34d399, #15803d); }
    .ball-red { background: radial-gradient(circle at 30% 30%, #f87171, #dc2626); }
    .ball-0 { background: linear-gradient(90deg, #dc2626 50%, #7c3aed 50%); }
    .ball-5 { background: linear-gradient(90deg, #7c3aed 50%, #16a34a 50%); }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 14px; margin-top: 10px;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    input.modal-inp, select.modal-inp {
      border-radius: 10px; border: 1px solid var(--border); padding: 10px 12px;
      font-size: 14px; color: var(--text); background: var(--card-2); width: 100%;
    }
    button { cursor: pointer; font-weight: 600; transition: 0.15s; }
    button:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); border: none; color: #fff; width: 100%; padding: 10px 12px; border-radius: 10px; }
    .btn-green { background: var(--green); border: none; color: #fff; }
    .btn-red { background: var(--red); border: none; color: #fff; }
    .btn-gold { background: var(--gold); color: #111; border: none; }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; background: var(--card-2); color: var(--text); border: 1px solid var(--border); }
    .tabs { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; }
    .tab-btn { background: var(--card-2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 13px; white-space: nowrap; }
    .tab-btn.active { background: var(--accent); border-color: transparent; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
    th, td { padding: 8px 6px; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--muted); }
    .badge { padding: 3px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; display: inline-block; }
    .pending { background: rgba(245,158,11,0.2); color: #fbbf24; }
    .approved { background: rgba(22,163,74,0.2); color: #4ade80; }
    .rejected { background: rgba(220,38,38,0.2); color: #f87171; }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.78); display: none;
      align-items: center; justify-content: center; z-index: 60; padding: 14px;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 16px; width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto;
    }
    .muted { color: var(--muted); font-size: 12px; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 12px; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }

    /* QR Payment Box */
    .qr-box {
      background: #ffffff;
      color: #0f172a;
      padding: 12px;
      border-radius: 14px;
      margin: 10px 0;
      text-align: center;
      border: 2px solid rgba(25, 195, 125, 0.45);
    }
    .qr-box img {
      width: 190px;
      height: 190px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      border-radius: 8px;
    }
    .qr-caption {
      font-size: 11px;
      font-weight: 700;
      color: #334155;
      margin-top: 6px;
    }
    .upi-intent-link {
      display: block; text-align: center; background: #16a34a; color: #fff;
      text-decoration: none; padding: 10px 12px; border-radius: 10px;
      font-weight: 700; font-size: 13px; margin-top: 8px;
    }

    /* Win / Loss Result Logo Card */
    .result-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.78);
      display: none; align-items: center; justify-content: center;
      z-index: 80; padding: 16px;
    }
    .result-overlay.open { display: flex; }
    .result-card {
      width: 100%; max-width: 340px; border-radius: 26px;
      padding: 46px 16px 18px 16px; position: relative;
      color: #ffffff; text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.65);
    }
    .result-card.theme-win {
      background: linear-gradient(180deg, #ff7a45 0%, #f44336 100%);
    }
    .result-card.theme-loss {
      background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
    }
    .result-badge-wrap {
      position: absolute; top: -38px; left: 50%; transform: translateX(-50%);
      width: 84px; height: 64px; display: flex; align-items: center; justify-content: center;
    }
    .result-wings {
      position: absolute; width: 112px; height: 42px; border-radius: 999px;
      background: rgba(255,255,255,0.28); filter: blur(1px);
    }
    .result-medallion {
      position: relative; width: 58px; height: 58px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fde047, #eab308);
      border: 3px solid #fef08a; display: flex; align-items: center; justify-content: center;
      font-size: 26px; box-shadow: 0 6px 14px rgba(0,0,0,0.3);
    }
    .result-title { font-size: 22px; font-weight: 900; letter-spacing: 0.3px; margin-top: 2px; }
    .result-lottery-row {
      display: flex; align-items: center; justify-content: center;
      gap: 6px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; font-weight: 700;
    }
    .res-chip {
      padding: 3px 9px; border-radius: 6px; font-size: 11px; font-weight: 800; color: #fff;
    }
    .res-ball {
      width: 22px; height: 22px; border-radius: 50%; display: inline-flex;
      align-items: center; justify-content: center; font-size: 11px; font-weight: 900;
      border: 1.5px solid rgba(255,255,255,0.8);
    }
    .result-slot-bar {
      height: 12px; border-radius: 999px; background: rgba(70, 18, 12, 0.45);
      margin-top: 14px; position: relative;
    }
    .result-slip {
      background: linear-gradient(180deg, #fff7ed 0%, #ffffff 65%, #f1f5f9 100%);
      color: #1e293b; margin: -4px 10px 0 10px;
      padding: 12px 12px 14px 12px;
      clip-path: polygon(0 0, 100% 0, 100% 88%, 92% 100%, 84% 88%, 76% 100%, 68% 88%, 60% 100%, 52% 88%, 44% 100%, 36% 88%, 28% 100%, 20% 88%, 12% 100%, 4% 88%, 0 100%);
    }
    .result-slip-label { font-size: 12px; font-weight: 800; color: #64748b; }
    .result-slip-amount { font-size: 24px; font-weight: 900; margin-top: 2px; }
    .theme-win .result-slip-amount { color: #ef4444; }
    .theme-loss .result-slip-amount { color: #16a34a; }
    .result-period-text { font-size: 11px; color: #64748b; margin-top: 6px; font-weight: 600; }
    .result-autoclose {
      display: flex; align-items: center; gap: 8px; margin-top: 14px;
      font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.92);
      cursor: pointer;
    }
    .autoclose-circle {
      width: 18px; height: 18px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.85);
      display: inline-flex; align-items: center; justify-content: center; font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="top-left">
        <span class="back-arrow" id="backBtn" title="Back / Logout">‹</span>
        <div class="brand" id="logoTap">Jalwa<span>.Game</span></div>
        <span class="uid-pill" id="uidBadge" style="display:none;">UID:786661</span>
      </div>
      <div class="top-right">
        <button class="lang-pill" type="button" id="langToggleBtn">🇺🇸 EN</button>
      </div>
    </header>

    <section class="reg-card" id="registerScreen">
      <div class="auth-mode-switch">
        <button class="auth-mode-btn active" type="button" id="modeRegisterBtn" onclick="setAuthMode('register')">Register</button>
        <button class="auth-mode-btn" type="button" id="modeLoginBtn" onclick="setAuthMode('login')">Login</button>
      </div>

      <div class="reg-hero">
        <div class="reg-phone-icon">📱</div>
        <div class="reg-heading" id="regHeadingText">Register your phone</div>
      </div>

      <div class="field-label">📱 <span id="lblPhone">Phone number</span></div>
      <div class="phone-row">
        <select class="dark-input" id="countryCodeSelect">
          <option value="+91">+91</option>
          <option value="+1">+1</option>
          <option value="+44">+44</option>
        </select>
        <input class="dark-input" type="tel" id="regPhoneInput" placeholder="Please enter the phone number" maxlength="10" />
      </div>

      <div class="field-label">🔒 <span id="lblSetPass">Set password</span></div>
      <div class="pw-wrap">
        <input class="dark-input" type="password" id="regPassInput" placeholder="Enter password" />
        <button class="eye-btn" type="button" onclick="togglePassVisibility('regPassInput')">👁</button>
      </div>

      <div id="registerOnlyFields">
        <div class="field-label">🔒 <span id="lblConfirmPass">Confirm password</span></div>
        <div class="pw-wrap">
          <input class="dark-input" type="password" id="regConfirmPassInput" placeholder="Confirm password" />
          <button class="eye-btn" type="button" onclick="togglePassVisibility('regConfirmPassInput')">👁</button>
        </div>

        <div class="field-label">👥 <span id="lblInviteCode">Invite code</span></div>
        <input class="dark-input" type="text" id="regInviteInput" value="568619351954" placeholder="Invite code" />

        <label class="agree-row">
          <input type="checkbox" id="agreePrivacyCheck" checked />
          <span id="agreeText">I have read and agree <a href="#" class="privacy-link" onclick="event.preventDefault();openModal('detailModal');">【Privacy Agreement】</a></span>
        </label>
      </div>

      <button class="btn-register" type="button" id="registerSubmitBtn">Register</button>
      <div class="switch-auth-note" id="switchAuthPrompt">
        पहले से आईडी बनी है? <span class="switch-auth-link" onclick="setAuthMode('login')">Login करें</span> · एक नंबर से एक ही आईडी बनेगी
      </div>
      <div class="switch-auth-note" id="startBalHint">नया अकाउंट ₹0.00 बैलेंस से शुरू होगा · Min Deposit/Withdraw ₹1,000</div>
    </section>

    <div id="gameScreen" style="display:none;">
      <section class="wallet-card">
        <div>
          <span class="wallet-bal" id="walletBalText">₹0.00</span>
          <span class="refresh-spin" id="refreshBalBtn" title="Refresh">↻</span>
        </div>
        <div class="wallet-sub">👛 Wallet balance <span id="activePhoneLabel" style="color:#93c5fd;"></span></div>
        <div class="wallet-actions">
          <button class="btn-withdraw" type="button" onclick="openModal('withdrawModal')">Withdraw</button>
          <button class="btn-deposit" type="button" onclick="openModal('depositModal')">Deposit</button>
        </div>
      </section>

      <div class="notice-bar">
        <span>📢</span>
        <div class="notice-text" id="noticeBox">1466@ptyes. Our
